name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend and architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      AGRO_TEST_POSTGIS: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Locked restore and dependency audit
        run: dotnet restore AgropecuarIA.slnx --locked-mode -p:NuGetAudit=true -p:NuGetAuditMode=all -p:NuGetAuditLevel=high
      - name: Release build (warnings are errors)
        run: dotnet build AgropecuarIA.slnx --configuration Release --no-restore
      - name: Verify the payload-free test diagnostic parser
        shell: pwsh
        run: ./scripts/ci/report-test-failures.Tests.ps1
      - name: All backend, real PostgreSQL/PostGIS and architecture tests
        id: backend-tests
        run: dotnet test --solution AgropecuarIA.slnx --configuration Release --no-restore --no-build --report-trx --results-directory "${{ github.workspace }}/TestResults/ci"
      - name: Report failed test methods without private test payloads
        if: always() && (steps.backend-tests.outcome == 'failure' || steps.backend-tests.outcome == 'success')
        shell: pwsh
        run: ./scripts/ci/report-test-failures.ps1 -ResultsDirectory ./TestResults/ci

  frontend:
    name: Frontend quality and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          package_json_file: apps/web/package.json
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Formatting
        run: pnpm format
      - name: Lint
        run: pnpm lint
      - name: Generate Next.js route types on the clean checkout
        run: pnpm exec next typegen
      - name: Type check
        run: pnpm typecheck
      - name: Unit and component tests
        run: pnpm test
      - name: Production build
        run: pnpm build
      - name: High-severity dependency audit
        run: pnpm audit --audit-level high
