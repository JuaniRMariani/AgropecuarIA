services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agropecuaria
      POSTGRES_USER: agropecuaria
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agropecuaria -d agropecuaria"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - agropecuaria-postgres:/var/lib/postgresql/data

volumes:
  agropecuaria-postgres:
