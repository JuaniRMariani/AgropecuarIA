openapi: 3.1.0
info:
  title: AgropecuarIA Identity API
  version: 1.5.0
paths:
  /api/identity/capabilities:
    get:
      summary: Public, non-sensitive identity capabilities
      responses:
        '200':
          description: Capabilities
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentityCapabilities' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/identity/session:
    get:
      summary: Current server-backed session
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Authenticated session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentitySession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/identity/sessions:
    get:
      summary: List the authenticated user's active durable sessions
      description: Returns only active sessions owned by the authenticated actor, ordered by authenticatedAtUtc descending and sessionId ascending. The current marker is derived by the server. No token, device, IP address or user-agent data is returned.
      security:
        - SessionCookie: []
      parameters:
        - in: query
          name: offset
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Stable page of active sessions owned by the authenticated actor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnSessionPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/SessionManagementUnavailable' }
  /api/identity/sessions/others:
    delete:
      summary: Revoke every other active session owned by the authenticated user
      description: Requires purpose-bound manage_sessions strong assurance. The current session is never revoked. Repeating the operation when no other active own sessions remain safely returns success without another journal entry. No session identifiers or counts are returned.
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AntiforgeryHeader'
      responses:
        '204': { description: Every other active own session is revoked, or none remain }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/SessionManagementUnavailable' }
  /api/identity/sessions/{sessionId}:
    delete:
      summary: Revoke another active session owned by the authenticated user
      description: Requires purpose-bound manage_sessions strong assurance. Revoking an already-revoked own session safely replays with no additional journal entry. Missing, foreign and expired sessions are indistinguishable. The current session must use the existing logout action.
      security:
        - SessionCookie: []
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/AntiforgeryHeader'
        - $ref: '#/components/parameters/IfMatchHeader'
      responses:
        '204': { description: Session revoked, or an authorized revocation safely replayed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/SessionNotAvailable' }
        '409': { $ref: '#/components/responses/SessionConflict' }
        '412': { $ref: '#/components/responses/SessionVersionMismatch' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/SessionManagementUnavailable' }
  /api/identity/antiforgery:
    get:
      summary: Issue an antiforgery token bound to the browser
      responses:
        '200':
          description: Antiforgery token; send it as `X-CSRF-TOKEN` on state changes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AntiforgeryToken' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/identity/login/{connection}:
    get:
      summary: Begin fresh OIDC authorization-code flow with PKCE
      description: Stores the protected challenge time and requests `max_age=0`; the callback must prove freshness with the signed `auth_time` claim.
      parameters:
        - in: path
          name: connection
          required: true
          schema: { type: string, enum: [email, google] }
        - in: query
          name: linkAttemptId
          required: false
          description: One-time attempt issued by `POST /api/identity/link-attempts`; the validated OIDC callback completes this link server-side.
          schema: { type: string, format: uuid }
      responses:
        '302': { description: Redirect to configured OIDC provider }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ProviderUnavailable' }
  /signin-oidc:
    get:
      summary: OIDC authorization-code callback handled by ASP.NET Core middleware
      description: Validates state, nonce, code, provider claims and signed `auth_time` against the protected challenge time; completes sign-in or a pending account link server-side.
      parameters:
        - in: query
          name: code
          required: false
          schema: { type: string }
        - in: query
          name: state
          required: false
          schema: { type: string }
        - in: query
          name: error
          required: false
          schema: { type: string }
      responses:
        '302': { description: Valid callback redirects to the same-origin web application }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/ProviderUnavailable' }
  /api/identity/link-attempts:
    post:
      summary: Start reauthentication of a second identity
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AntiforgeryHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartLinkAttempt' }
      responses:
        '201':
          description: One-time link attempt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LinkAttempt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ProviderUnavailable' }
  /api/identity/step-up-attempts:
    post:
      summary: Start a purpose-bound strong-authentication attempt
      description: Creates a one-use attempt tied to the authenticated user and current durable session. It never accepts a user, tenant or return URL from the client.
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AntiforgeryHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartStepUpAttempt' }
      responses:
        '201':
          description: One-time step-up attempt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StepUpAttempt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ProviderUnavailable' }
  /api/identity/step-up/{attemptId}:
    get:
      summary: Challenge the provider for fresh MFA on a one-time attempt
      description: Requests `max_age=0` and the Auth0 MFA `acr_values`; the callback must also contain signed `auth_time` and `amr=mfa` before rotating the application session.
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AttemptId'
      responses:
        '302': { description: Redirect to configured OIDC provider }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ProviderUnavailable' }
  /api/identity/link-attempts/{attemptId}/complete:
    post:
      summary: Consume two verified proofs and link the identity atomically
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/AntiforgeryHeader'
      responses:
        '200':
          description: Updated session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentitySession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/identity/identities/{identityId}:
    delete:
      summary: Unlink an identity after reauthentication
      security:
        - SessionCookie: []
      parameters:
        - in: path
          name: identityId
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/AntiforgeryHeader'
      responses:
        '204': { description: Identity unlinked }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/identity/session/revoke:
    post:
      summary: Revoke the current durable session
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AntiforgeryHeader'
      responses:
        '204': { description: Session revoked and cookie removed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/identity/organizations:
    post:
      summary: Create a private organization and its initial owner membership
      description: Uses a server-derived platform bootstrap scope. The request cannot choose the actor, tenant, role or platform privileges. A verified authentication younger than 15 minutes is required; MFA is not required.
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AntiforgeryHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrganization' }
      responses:
        '201':
          description: Organization and active owner membership created, or safely replayed after current authorization is revalidated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedOrganization' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/OrganizationCreationConflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/OrganizationCreationUnavailableOrReconciliation' }
  /api/identity/organizations/{organizationId}/owner-invitations:
    get:
      summary: List co-owner invitations visible to an active owner
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Invitations ordered newest first; raw tokens are never returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnerInvitationList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/OwnerInvitationUnavailable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/OwnerInvitationServiceUnavailable' }
    post:
      summary: Create a one-shot bearer invitation for a co-owner
      description: Requires an active owner membership and strong assurance for manage_organization_owners. The token is returned exactly once and must not be logged or placed in a query string.
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/AntiforgeryHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmptyObject' }
      responses:
        '201':
          description: Invitation created; token is visible only in this no-store response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedOwnerInvitation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/OwnerInvitationUnavailable' }
        '409': { $ref: '#/components/responses/OwnerInvitationConflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/OwnerInvitationServiceUnavailable' }
  /api/identity/organizations/{organizationId}/owner-memberships:
    get:
      summary: List active co-owner memberships visible to an active owner
      description: Returns only the tenant-local display fields needed to manage co-owners; it never exposes platform user IDs, email addresses or external identities.
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Active owner memberships ordered by join time and membership ID
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OwnerMembership' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/OwnerMembershipUnavailable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/OwnerMembershipServiceUnavailable' }
  /api/identity/organizations/{organizationId}/owner-memberships/{membershipId}:
    delete:
      summary: Remove another active co-owner while preserving the last owner
      description: Requires an active owner, purpose-bound strong assurance and a server-derived tenant context. Self-removal is deliberately outside this contract.
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/MembershipId'
        - $ref: '#/components/parameters/AntiforgeryHeader'
        - $ref: '#/components/parameters/IfMatchHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      responses:
        '200':
          description: Membership removed, or safely replayed after current authorization is revalidated
          headers:
            ETag:
              description: Current membership concurrency version
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RemovedOwnerMembership' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/OwnerMembershipUnavailable' }
        '409': { $ref: '#/components/responses/OwnerMembershipConflict' }
        '412': { $ref: '#/components/responses/OwnerMembershipVersionMismatch' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/OwnerMembershipServiceUnavailable' }
  /api/identity/organizations/{organizationId}/owner-invitations/{invitationId}/revoke:
    post:
      summary: Revoke a pending co-owner invitation
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/InvitationId'
        - $ref: '#/components/parameters/AntiforgeryHeader'
        - $ref: '#/components/parameters/IfMatchHeader'
      responses:
        '200':
          description: Revoked invitation
          headers:
            ETag:
              description: Current invitation version
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnerInvitation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/OwnerInvitationUnavailable' }
        '409': { $ref: '#/components/responses/OwnerInvitationConflict' }
        '412': { $ref: '#/components/responses/OwnerInvitationVersionMismatch' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/OwnerInvitationServiceUnavailable' }
  /api/identity/owner-invitations/accept:
    post:
      summary: Accept a one-shot co-owner invitation
      description: The bearer token is resolved in a server-derived platform acceptance scope, then the membership is created under the invitation organization in one transaction.
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AntiforgeryHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptOwnerInvitation' }
      responses:
        '200':
          description: Co-owner membership granted, or safely replayed by the same accepting user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedOrganization' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/OwnerInvitationUnavailable' }
        '409': { $ref: '#/components/responses/OwnerInvitationConflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/OwnerInvitationServiceUnavailable' }
  /api/development/identity/sign-in:
    post:
      summary: Development/Test-only synthetic verified sign-in
      parameters:
        - $ref: '#/components/parameters/AntiforgeryHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DevelopmentFixture' }
      responses:
        '204': { description: Synthetic session issued }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '404': { description: Endpoint absent outside Development/Test }
  /api/development/identity/link-attempts/{attemptId}/verify:
    post:
      summary: Development/Test-only synthetic proof for the candidate identity
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/AntiforgeryHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DevelopmentFixture' }
      responses:
        '204': { description: Candidate proof attached to the attempt }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '404': { description: Endpoint absent outside Development/Test }
  /api/development/identity/step-up-attempts/{attemptId}/complete:
    post:
      summary: Development/Test-only synthetic MFA proof and session rotation
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/AntiforgeryHeader'
      responses:
        '200':
          description: Rotated synthetic session with purpose-bound strong assurance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentitySession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '404': { description: Endpoint absent outside Development/Test }
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: __Host-agro-session
      description: Opaque server-backed session cookie; JavaScript cannot read it.
  responses:
    BadRequest:
      description: Invalid request body or antiforgery token
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Missing, expired or revoked session
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Authenticated session lacks the recent authentication required for this action
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Replay, stale authentication, ownership or concurrency conflict
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    OrganizationCreationConflict:
      description: The idempotency key conflicts with another request or the original request is still in progress
      headers:
        Retry-After:
          description: Delay in seconds before retrying; present for idempotency.in_progress
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: Per-IP or per-session request limit exceeded
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ProviderUnavailable:
      description: Configured OIDC provider or connection unavailable
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    SessionNotAvailable:
      description: The session is missing, foreign, expired or otherwise unavailable to the current actor
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    SessionConflict:
      description: The target is the current session and must be closed through the existing logout action
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    SessionVersionMismatch:
      description: The supplied strong ETag no longer matches the target session version
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    SessionManagementUnavailable:
      description: Session inventory or revocation is temporarily unavailable
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    OrganizationCreationUnavailableOrReconciliation:
      description: Organization creation is fail-closed because configuration is unavailable or the commit outcome requires retrying with the same idempotency key
      headers:
        Retry-After:
          description: Delay in seconds before retrying; present for idempotency.reconciliation_required
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    OwnerInvitationUnavailable:
      description: Invitation or organization is unavailable to the current actor; foreign and missing resources are indistinguishable
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    OwnerInvitationConflict:
      description: Invitation state or version no longer permits the requested transition
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    OwnerInvitationVersionMismatch:
      description: The supplied strong ETag no longer matches the invitation version
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    OwnerInvitationServiceUnavailable:
      description: Invitation handling is disabled or cannot resolve the token safely
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    OwnerMembershipUnavailable:
      description: Organization or membership is unavailable to the current actor; foreign, missing, self and removed resources are indistinguishable
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    OwnerMembershipConflict:
      description: Removal would violate the last-owner invariant, conflicts with another request or is still in progress
      headers:
        Retry-After:
          description: Delay in seconds before retrying; present for an in-progress idempotent operation
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    OwnerMembershipVersionMismatch:
      description: The supplied strong ETag no longer matches the membership version
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    OwnerMembershipServiceUnavailable:
      description: Membership removal is fail-closed because configuration or the commit outcome requires retrying with the same idempotency key
      headers:
        Retry-After:
          description: Delay in seconds before retrying an unresolved commit outcome
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  parameters:
    AntiforgeryHeader:
      in: header
      name: X-CSRF-TOKEN
      required: true
      schema: { type: string, minLength: 1 }
    AttemptId:
      in: path
      name: attemptId
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKeyHeader:
      in: header
      name: Idempotency-Key
      required: true
      description: AgropecuarIA opaque visible-ASCII key retained for the logical create attempt; never derive it from user, tenant or organization identifiers. This contract does not use RFC 9651 serialization.
      schema: { type: string, minLength: 16, maxLength: 128, pattern: '^[!-~]+$' }
    OrganizationId:
      in: path
      name: organizationId
      required: true
      schema: { type: string, format: uuid }
    InvitationId:
      in: path
      name: invitationId
      required: true
      schema: { type: string, format: uuid }
    MembershipId:
      in: path
      name: membershipId
      required: true
      schema: { type: string, format: uuid }
    IfMatchHeader:
      in: header
      name: If-Match
      required: true
      description: Strong ETag containing the resource concurrency UUID returned by the API
      schema: { type: string, pattern: '^"[0-9a-fA-F-]{36}"$' }
  schemas:
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, correlationId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        code: { type: string }
        correlationId: { type: string }
        retryable: { type: boolean }
    EmptyObject:
      type: object
      additionalProperties: false
    IdentityCapabilities:
      type: object
      additionalProperties: false
      required: [environment, oidcConfigured, developmentProviderEnabled, strongAuthenticationAvailable, ownerInvitationsAvailable, connections]
      properties:
        environment: { type: string }
        oidcConfigured: { type: boolean }
        developmentProviderEnabled: { type: boolean }
        strongAuthenticationAvailable: { type: boolean }
        ownerInvitationsAvailable: { type: boolean }
        connections:
          type: array
          items: { $ref: '#/components/schemas/IdentityConnection' }
    IdentityConnection:
      type: object
      additionalProperties: false
      required: [id, label, available]
      properties:
        id: { type: string, enum: [email, google] }
        label: { type: string }
        available: { type: boolean }
    IdentitySession:
      type: object
      additionalProperties: false
      required: [userId, displayName, authentication, identities, memberships]
      properties:
        userId: { type: string, format: uuid }
        displayName: { type: string }
        authentication: { $ref: '#/components/schemas/AuthenticationAssurance' }
        identities:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/LinkedIdentity' }
        memberships:
          type: array
          items: { $ref: '#/components/schemas/MembershipSummary' }
    OwnSessionPage:
      type: object
      additionalProperties: false
      required: [items, total, offset, limit]
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/OwnSessionSummary' }
        total: { type: integer, format: int64, minimum: 0 }
        offset: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 50 }
    OwnSessionSummary:
      type: object
      additionalProperties: false
      required: [sessionId, authenticatedAtUtc, expiresAtUtc, isCurrent, version]
      properties:
        sessionId: { type: string, format: uuid }
        authenticatedAtUtc: { type: string, format: date-time }
        expiresAtUtc: { type: string, format: date-time }
        isCurrent: { type: boolean }
        version: { type: string, format: uuid }
    LinkedIdentity:
      type: object
      additionalProperties: false
      required: [identityId, connection, label, verifiedAtUtc]
      properties:
        identityId: { type: string, format: uuid }
        connection: { type: string, enum: [email, google] }
        label: { type: string, description: Masked, non-enumerating display label }
        verifiedAtUtc: { type: string, format: date-time }
    MembershipSummary:
      type: object
      additionalProperties: false
      required: [organizationId, organizationName, role]
      properties:
        organizationId: { type: string, format: uuid }
        organizationName: { type: string }
        role: { type: string }
    CreateOrganization:
      type: object
      additionalProperties: false
      required: [displayName]
      properties:
        displayName: { type: string, minLength: 2, maxLength: 160, description: Trimmed and normalized to Unicode NFC by the server; names are not globally unique. }
    CreatedOrganization:
      type: object
      additionalProperties: false
      required: [organization, membership]
      properties:
        organization: { $ref: '#/components/schemas/OrganizationSummary' }
        membership: { $ref: '#/components/schemas/CreatedOwnerMembership' }
    OrganizationSummary:
      type: object
      additionalProperties: false
      required: [organizationId, displayName, status]
      properties:
        organizationId: { type: string, format: uuid }
        displayName: { type: string }
        status: { type: string, enum: [active] }
    CreatedOwnerMembership:
      type: object
      additionalProperties: false
      required: [membershipId, role, status, authorizationVersion]
      properties:
        membershipId: { type: string, format: uuid }
        role: { type: string, enum: [owner] }
        status: { type: string, enum: [active] }
        authorizationVersion: { type: integer, minimum: 1 }
    OwnerMembership:
      type: object
      additionalProperties: false
      required: [membershipId, organizationId, displayName, isCurrentUser, role, status, authorizationVersion, createdAtUtc, removedAtUtc, version]
      properties:
        membershipId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        displayName: { type: string, minLength: 1, maxLength: 160 }
        isCurrentUser: { type: boolean }
        role: { type: string, enum: [owner] }
        status: { type: string, enum: [active] }
        authorizationVersion: { type: integer, minimum: 1 }
        createdAtUtc: { type: string, format: date-time }
        removedAtUtc: { type: 'null' }
        version: { type: string, format: uuid }
    RemovedOwnerMembership:
      type: object
      additionalProperties: false
      required: [membershipId, organizationId, displayName, isCurrentUser, role, status, authorizationVersion, createdAtUtc, removedAtUtc, version, isReplay]
      properties:
        membershipId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        displayName: { type: string, minLength: 1, maxLength: 160 }
        isCurrentUser: { type: boolean }
        role: { type: string, enum: [owner] }
        status: { type: string, enum: [removed] }
        authorizationVersion: { type: integer, minimum: 2 }
        createdAtUtc: { type: string, format: date-time }
        removedAtUtc: { type: string, format: date-time }
        version: { type: string, format: uuid }
        isReplay: { type: boolean }
    OwnerInvitation:
      type: object
      additionalProperties: false
      required: [invitationId, organizationId, status, createdAtUtc, expiresAtUtc, acceptedAtUtc, revokedAtUtc, version]
      properties:
        invitationId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        status: { type: string, enum: [pending, accepted, revoked, expired] }
        createdAtUtc: { type: string, format: date-time }
        expiresAtUtc: { type: string, format: date-time }
        acceptedAtUtc:
          oneOf:
            - { type: string, format: date-time }
            - { type: 'null' }
        revokedAtUtc:
          oneOf:
            - { type: string, format: date-time }
            - { type: 'null' }
        version: { type: string, format: uuid }
    CreatedOwnerInvitation:
      type: object
      additionalProperties: false
      required: [invitation, token, isReplay]
      properties:
        invitation: { $ref: '#/components/schemas/OwnerInvitation' }
        token:
          description: Base64URL bearer token returned once; null on an idempotent replay
          oneOf:
            - { type: string, minLength: 43, maxLength: 43 }
            - { type: 'null' }
        isReplay: { type: boolean }
    OwnerInvitationList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/OwnerInvitation' }
    AcceptOwnerInvitation:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, minLength: 43, maxLength: 43 }
    AuthenticationAssurance:
      type: object
      additionalProperties: false
      required: [level, authenticatedAtUtc, purpose, strongAuthenticatedAtUtc, expiresAtUtc]
      properties:
        level: { type: string, enum: [primary, strong] }
        authenticatedAtUtc: { type: string, format: date-time }
        purpose:
          oneOf:
            - { type: string, enum: [manage_authentication_methods, manage_organization_owners, manage_sessions] }
            - { type: 'null' }
        strongAuthenticatedAtUtc:
          oneOf:
            - { type: string, format: date-time }
            - { type: 'null' }
        expiresAtUtc:
          oneOf:
            - { type: string, format: date-time }
            - { type: 'null' }
    AntiforgeryToken:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, minLength: 1 }
    StartLinkAttempt:
      type: object
      additionalProperties: false
      required: [connection]
      properties:
        connection: { type: string, enum: [email, google] }
    LinkAttempt:
      type: object
      additionalProperties: false
      required: [attemptId, connection, expiresAtUtc, authorizationUrl]
      properties:
        attemptId: { type: string, format: uuid }
        connection: { type: string, enum: [email, google] }
        expiresAtUtc: { type: string, format: date-time }
        authorizationUrl: { type: string, format: uri-reference }
    StartStepUpAttempt:
      type: object
      additionalProperties: false
      required: [purpose]
      properties:
        purpose: { type: string, enum: [manage_authentication_methods, manage_organization_owners, manage_sessions] }
    StepUpAttempt:
      type: object
      additionalProperties: false
      required: [attemptId, purpose, expiresAtUtc, authorizationUrl]
      properties:
        attemptId: { type: string, format: uuid }
        purpose: { type: string, enum: [manage_authentication_methods, manage_organization_owners, manage_sessions] }
        expiresAtUtc: { type: string, format: date-time }
        authorizationUrl: { type: string, format: uri-reference }
    DevelopmentFixture:
      type: object
      additionalProperties: false
      required: [fixture]
      properties:
        fixture:
          type: string
          enum:
            - email-owner
            - email-owner-1
            - email-owner-2
            - email-owner-3
            - email-owner-4
            - google-owner
            - google-owner-1
            - google-owner-2
            - google-owner-3
            - google-owner-4
            - unverified-email
            - provider-down
            - identity-owned-by-another-user
