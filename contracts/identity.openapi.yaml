openapi: 3.1.0
info:
  title: AgropecuarIA Identity API
  version: 1.1.0
paths:
  /api/identity/capabilities:
    get:
      summary: Public, non-sensitive identity capabilities
      responses:
        '200':
          description: Capabilities
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentityCapabilities' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/identity/session:
    get:
      summary: Current server-backed session
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Authenticated session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentitySession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/identity/antiforgery:
    get:
      summary: Issue an antiforgery token bound to the browser
      responses:
        '200':
          description: Antiforgery token; send it as `X-CSRF-TOKEN` on state changes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AntiforgeryToken' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/identity/login/{connection}:
    get:
      summary: Begin fresh OIDC authorization-code flow with PKCE
      description: Stores the protected challenge time and requests `max_age=0`; the callback must prove freshness with the signed `auth_time` claim.
      parameters:
        - in: path
          name: connection
          required: true
          schema: { type: string, enum: [email, google] }
        - in: query
          name: linkAttemptId
          required: false
          description: One-time attempt issued by `POST /api/identity/link-attempts`; the validated OIDC callback completes this link server-side.
          schema: { type: string, format: uuid }
      responses:
        '302': { description: Redirect to configured OIDC provider }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ProviderUnavailable' }
  /signin-oidc:
    get:
      summary: OIDC authorization-code callback handled by ASP.NET Core middleware
      description: Validates state, nonce, code, provider claims and signed `auth_time` against the protected challenge time; completes sign-in or a pending account link server-side.
      parameters:
        - in: query
          name: code
          required: false
          schema: { type: string }
        - in: query
          name: state
          required: false
          schema: { type: string }
        - in: query
          name: error
          required: false
          schema: { type: string }
      responses:
        '302': { description: Valid callback redirects to the same-origin web application }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/ProviderUnavailable' }
  /api/identity/link-attempts:
    post:
      summary: Start reauthentication of a second identity
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AntiforgeryHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartLinkAttempt' }
      responses:
        '201':
          description: One-time link attempt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LinkAttempt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ProviderUnavailable' }
  /api/identity/step-up-attempts:
    post:
      summary: Start a purpose-bound strong-authentication attempt
      description: Creates a one-use attempt tied to the authenticated user and current durable session. It never accepts a user, tenant or return URL from the client.
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AntiforgeryHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartStepUpAttempt' }
      responses:
        '201':
          description: One-time step-up attempt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StepUpAttempt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ProviderUnavailable' }
  /api/identity/step-up/{attemptId}:
    get:
      summary: Challenge the provider for fresh MFA on a one-time attempt
      description: Requests `max_age=0` and the Auth0 MFA `acr_values`; the callback must also contain signed `auth_time` and `amr=mfa` before rotating the application session.
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AttemptId'
      responses:
        '302': { description: Redirect to configured OIDC provider }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ProviderUnavailable' }
  /api/identity/link-attempts/{attemptId}/complete:
    post:
      summary: Consume two verified proofs and link the identity atomically
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/AntiforgeryHeader'
      responses:
        '200':
          description: Updated session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentitySession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/identity/identities/{identityId}:
    delete:
      summary: Unlink an identity after reauthentication
      security:
        - SessionCookie: []
      parameters:
        - in: path
          name: identityId
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/AntiforgeryHeader'
      responses:
        '204': { description: Identity unlinked }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/identity/session/revoke:
    post:
      summary: Revoke the current durable session
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AntiforgeryHeader'
      responses:
        '204': { description: Session revoked and cookie removed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/identity/organizations:
    post:
      summary: Create a private organization and its initial owner membership
      description: Uses a server-derived platform bootstrap scope. The request cannot choose the actor, tenant, role or platform privileges. A verified authentication younger than 15 minutes is required; MFA is not required.
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AntiforgeryHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrganization' }
      responses:
        '201':
          description: Organization and active owner membership created, or safely replayed after current authorization is revalidated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedOrganization' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/OrganizationCreationConflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/OrganizationCreationUnavailableOrReconciliation' }
  /api/development/identity/sign-in:
    post:
      summary: Development/Test-only synthetic verified sign-in
      parameters:
        - $ref: '#/components/parameters/AntiforgeryHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DevelopmentFixture' }
      responses:
        '204': { description: Synthetic session issued }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '404': { description: Endpoint absent outside Development/Test }
  /api/development/identity/link-attempts/{attemptId}/verify:
    post:
      summary: Development/Test-only synthetic proof for the candidate identity
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/AntiforgeryHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DevelopmentFixture' }
      responses:
        '204': { description: Candidate proof attached to the attempt }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '404': { description: Endpoint absent outside Development/Test }
  /api/development/identity/step-up-attempts/{attemptId}/complete:
    post:
      summary: Development/Test-only synthetic MFA proof and session rotation
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/AntiforgeryHeader'
      responses:
        '200':
          description: Rotated synthetic session with purpose-bound strong assurance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentitySession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '404': { description: Endpoint absent outside Development/Test }
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: __Host-agro-session
      description: Opaque server-backed session cookie; JavaScript cannot read it.
  responses:
    BadRequest:
      description: Invalid request body or antiforgery token
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Missing, expired or revoked session
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Authenticated session lacks the recent authentication required for this action
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Replay, stale authentication, ownership or concurrency conflict
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    OrganizationCreationConflict:
      description: The idempotency key conflicts with another request or the original request is still in progress
      headers:
        Retry-After:
          description: Delay in seconds before retrying; present for idempotency.in_progress
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: Per-IP or per-session request limit exceeded
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ProviderUnavailable:
      description: Configured OIDC provider or connection unavailable
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    OrganizationCreationUnavailableOrReconciliation:
      description: Organization creation is fail-closed because configuration is unavailable or the commit outcome requires retrying with the same idempotency key
      headers:
        Retry-After:
          description: Delay in seconds before retrying; present for idempotency.reconciliation_required
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  parameters:
    AntiforgeryHeader:
      in: header
      name: X-CSRF-TOKEN
      required: true
      schema: { type: string, minLength: 1 }
    AttemptId:
      in: path
      name: attemptId
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKeyHeader:
      in: header
      name: Idempotency-Key
      required: true
      description: AgropecuarIA opaque visible-ASCII key retained for the logical create attempt; never derive it from user, tenant or organization identifiers. This contract does not use RFC 9651 serialization.
      schema: { type: string, minLength: 16, maxLength: 128, pattern: '^[!-~]+$' }
  schemas:
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, correlationId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        code: { type: string }
        correlationId: { type: string }
        retryable: { type: boolean }
    IdentityCapabilities:
      type: object
      additionalProperties: false
      required: [environment, oidcConfigured, developmentProviderEnabled, strongAuthenticationAvailable, connections]
      properties:
        environment: { type: string }
        oidcConfigured: { type: boolean }
        developmentProviderEnabled: { type: boolean }
        strongAuthenticationAvailable: { type: boolean }
        connections:
          type: array
          items: { $ref: '#/components/schemas/IdentityConnection' }
    IdentityConnection:
      type: object
      additionalProperties: false
      required: [id, label, available]
      properties:
        id: { type: string, enum: [email, google] }
        label: { type: string }
        available: { type: boolean }
    IdentitySession:
      type: object
      additionalProperties: false
      required: [userId, displayName, authentication, identities, memberships]
      properties:
        userId: { type: string, format: uuid }
        displayName: { type: string }
        authentication: { $ref: '#/components/schemas/AuthenticationAssurance' }
        identities:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/LinkedIdentity' }
        memberships:
          type: array
          items: { $ref: '#/components/schemas/MembershipSummary' }
    LinkedIdentity:
      type: object
      additionalProperties: false
      required: [identityId, connection, label, verifiedAtUtc]
      properties:
        identityId: { type: string, format: uuid }
        connection: { type: string, enum: [email, google] }
        label: { type: string, description: Masked, non-enumerating display label }
        verifiedAtUtc: { type: string, format: date-time }
    MembershipSummary:
      type: object
      additionalProperties: false
      required: [organizationId, organizationName, role]
      properties:
        organizationId: { type: string, format: uuid }
        organizationName: { type: string }
        role: { type: string }
    CreateOrganization:
      type: object
      additionalProperties: false
      required: [displayName]
      properties:
        displayName: { type: string, minLength: 2, maxLength: 160, description: Trimmed and normalized to Unicode NFC by the server; names are not globally unique. }
    CreatedOrganization:
      type: object
      additionalProperties: false
      required: [organization, membership]
      properties:
        organization: { $ref: '#/components/schemas/OrganizationSummary' }
        membership: { $ref: '#/components/schemas/CreatedOwnerMembership' }
    OrganizationSummary:
      type: object
      additionalProperties: false
      required: [organizationId, displayName, status]
      properties:
        organizationId: { type: string, format: uuid }
        displayName: { type: string }
        status: { type: string, enum: [active] }
    CreatedOwnerMembership:
      type: object
      additionalProperties: false
      required: [membershipId, role, status, authorizationVersion]
      properties:
        membershipId: { type: string, format: uuid }
        role: { type: string, enum: [owner] }
        status: { type: string, enum: [active] }
        authorizationVersion: { type: integer, minimum: 1 }
    AuthenticationAssurance:
      type: object
      additionalProperties: false
      required: [level, authenticatedAtUtc, purpose, strongAuthenticatedAtUtc, expiresAtUtc]
      properties:
        level: { type: string, enum: [primary, strong] }
        authenticatedAtUtc: { type: string, format: date-time }
        purpose:
          oneOf:
            - { type: string, enum: [manage_authentication_methods] }
            - { type: 'null' }
        strongAuthenticatedAtUtc:
          oneOf:
            - { type: string, format: date-time }
            - { type: 'null' }
        expiresAtUtc:
          oneOf:
            - { type: string, format: date-time }
            - { type: 'null' }
    AntiforgeryToken:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, minLength: 1 }
    StartLinkAttempt:
      type: object
      additionalProperties: false
      required: [connection]
      properties:
        connection: { type: string, enum: [email, google] }
    LinkAttempt:
      type: object
      additionalProperties: false
      required: [attemptId, connection, expiresAtUtc, authorizationUrl]
      properties:
        attemptId: { type: string, format: uuid }
        connection: { type: string, enum: [email, google] }
        expiresAtUtc: { type: string, format: date-time }
        authorizationUrl: { type: string, format: uri-reference }
    StartStepUpAttempt:
      type: object
      additionalProperties: false
      required: [purpose]
      properties:
        purpose: { type: string, enum: [manage_authentication_methods] }
    StepUpAttempt:
      type: object
      additionalProperties: false
      required: [attemptId, purpose, expiresAtUtc, authorizationUrl]
      properties:
        attemptId: { type: string, format: uuid }
        purpose: { type: string, enum: [manage_authentication_methods] }
        expiresAtUtc: { type: string, format: date-time }
        authorizationUrl: { type: string, format: uri-reference }
    DevelopmentFixture:
      type: object
      additionalProperties: false
      required: [fixture]
      properties:
        fixture:
          type: string
          enum:
            - email-owner
            - email-owner-1
            - email-owner-2
            - email-owner-3
            - email-owner-4
            - google-owner
            - google-owner-1
            - google-owner-2
            - google-owner-3
            - google-owner-4
            - unverified-email
            - provider-down
            - identity-owned-by-another-user
