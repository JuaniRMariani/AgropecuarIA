openapi: 3.1.0
info:
  title: AgropecuarIA Identity API
  version: 1.0.0
paths:
  /api/identity/capabilities:
    get:
      summary: Public, non-sensitive identity capabilities
      responses:
        '200':
          description: Capabilities
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentityCapabilities' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/identity/session:
    get:
      summary: Current server-backed session
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Authenticated session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentitySession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/identity/antiforgery:
    get:
      summary: Issue an antiforgery token bound to the browser
      responses:
        '200':
          description: Antiforgery token; send it as `X-CSRF-TOKEN` on state changes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AntiforgeryToken' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/identity/login/{connection}:
    get:
      summary: Begin OIDC authorization-code flow with PKCE
      parameters:
        - in: path
          name: connection
          required: true
          schema: { type: string, enum: [email, google] }
        - in: query
          name: linkAttemptId
          required: false
          description: One-time attempt issued by `POST /api/identity/link-attempts`; the validated OIDC callback completes this link server-side.
          schema: { type: string, format: uuid }
      responses:
        '302': { description: Redirect to configured OIDC provider }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ProviderUnavailable' }
  /signin-oidc:
    get:
      summary: OIDC authorization-code callback handled by ASP.NET Core middleware
      description: Validates state, nonce, code and provider claims; completes sign-in or a pending account link server-side.
      parameters:
        - in: query
          name: code
          required: false
          schema: { type: string }
        - in: query
          name: state
          required: false
          schema: { type: string }
        - in: query
          name: error
          required: false
          schema: { type: string }
      responses:
        '302': { description: Valid callback redirects to the same-origin web application }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/ProviderUnavailable' }
  /api/identity/link-attempts:
    post:
      summary: Start reauthentication of a second identity
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AntiforgeryHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartLinkAttempt' }
      responses:
        '201':
          description: One-time link attempt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LinkAttempt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ProviderUnavailable' }
  /api/identity/link-attempts/{attemptId}/complete:
    post:
      summary: Consume two verified proofs and link the identity atomically
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/AntiforgeryHeader'
      responses:
        '200':
          description: Updated session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentitySession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/identity/identities/{identityId}:
    delete:
      summary: Unlink an identity after reauthentication
      security:
        - SessionCookie: []
      parameters:
        - in: path
          name: identityId
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/AntiforgeryHeader'
      responses:
        '204': { description: Identity unlinked }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/identity/session/revoke:
    post:
      summary: Revoke the current durable session
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AntiforgeryHeader'
      responses:
        '204': { description: Session revoked and cookie removed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/development/identity/sign-in:
    post:
      summary: Development/Test-only synthetic verified sign-in
      parameters:
        - $ref: '#/components/parameters/AntiforgeryHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DevelopmentFixture' }
      responses:
        '204': { description: Synthetic session issued }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '404': { description: Endpoint absent outside Development/Test }
  /api/development/identity/link-attempts/{attemptId}/verify:
    post:
      summary: Development/Test-only synthetic proof for the candidate identity
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/AntiforgeryHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DevelopmentFixture' }
      responses:
        '204': { description: Candidate proof attached to the attempt }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '404': { description: Endpoint absent outside Development/Test }
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: __Host-agro-session
      description: Opaque server-backed session cookie; JavaScript cannot read it.
  responses:
    BadRequest:
      description: Invalid request body or antiforgery token
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Missing, expired or revoked session
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Replay, stale authentication, ownership or concurrency conflict
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: Per-IP or per-session request limit exceeded
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    ProviderUnavailable:
      description: Configured OIDC provider or connection unavailable
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  parameters:
    AntiforgeryHeader:
      in: header
      name: X-CSRF-TOKEN
      required: true
      schema: { type: string, minLength: 1 }
    AttemptId:
      in: path
      name: attemptId
      required: true
      schema: { type: string, format: uuid }
  schemas:
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status, code, correlationId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        code: { type: string }
        correlationId: { type: string }
    IdentityCapabilities:
      type: object
      additionalProperties: false
      required: [environment, oidcConfigured, developmentProviderEnabled, connections]
      properties:
        environment: { type: string }
        oidcConfigured: { type: boolean }
        developmentProviderEnabled: { type: boolean }
        connections:
          type: array
          items: { $ref: '#/components/schemas/IdentityConnection' }
    IdentityConnection:
      type: object
      additionalProperties: false
      required: [id, label, available]
      properties:
        id: { type: string, enum: [email, google] }
        label: { type: string }
        available: { type: boolean }
    IdentitySession:
      type: object
      additionalProperties: false
      required: [userId, displayName, identities, memberships]
      properties:
        userId: { type: string, format: uuid }
        displayName: { type: string }
        identities:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/LinkedIdentity' }
        memberships:
          type: array
          items: { $ref: '#/components/schemas/MembershipSummary' }
    LinkedIdentity:
      type: object
      additionalProperties: false
      required: [identityId, connection, label, verifiedAtUtc]
      properties:
        identityId: { type: string, format: uuid }
        connection: { type: string, enum: [email, google] }
        label: { type: string, description: Masked, non-enumerating display label }
        verifiedAtUtc: { type: string, format: date-time }
    MembershipSummary:
      type: object
      additionalProperties: false
      required: [organizationId, organizationName, role]
      properties:
        organizationId: { type: string, format: uuid }
        organizationName: { type: string }
        role: { type: string }
    AntiforgeryToken:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, minLength: 1 }
    StartLinkAttempt:
      type: object
      additionalProperties: false
      required: [connection]
      properties:
        connection: { type: string, enum: [email, google] }
    LinkAttempt:
      type: object
      additionalProperties: false
      required: [attemptId, connection, expiresAtUtc, authorizationUrl]
      properties:
        attemptId: { type: string, format: uuid }
        connection: { type: string, enum: [email, google] }
        expiresAtUtc: { type: string, format: date-time }
        authorizationUrl: { type: string, format: uri-reference }
    DevelopmentFixture:
      type: object
      additionalProperties: false
      required: [fixture]
      properties:
        fixture:
          type: string
          enum: [email-owner, google-owner, unverified-email, provider-down, identity-owned-by-another-user]
