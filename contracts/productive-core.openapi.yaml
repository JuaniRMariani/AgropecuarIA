    ProductionTimeline:
      type: object
      additionalProperties: false
      required: [cycle, events]
      properties:
        cycle: { $ref: '#/components/schemas/ProductionCycle' }
        events:
          type: array
          items: { $ref: '#/components/schemas/ProductionEvent' }
    CreateFieldRequest:
      type: object
      description: displayName trims leading and trailing Unicode White_Space plus U+FEFF, then normalizes to NFC, counts Unicode scalars and rejects controls or lone surrogates.
      additionalProperties: false
      required: [displayName]
      properties:
        displayName: { type: string, minLength: 2, maxLength: 120 }
    RenameFieldRequest:
      type: object
      description: displayName follows the same Unicode White_Space plus U+FEFF trim, NFC, scalar-count and control/surrogate policy as create.
      additionalProperties: false
      required: [displayName]
      properties:
        displayName: { type: string, minLength: 2, maxLength: 120 }
    ConfigureFieldGeometryRequest:
      type: object
      additionalProperties: false
      required: [boundaryGeoJson, declaredAreaHectares]
      properties:
        boundaryGeoJson:
          type: string
          minLength: 1
          description: GeoJSON geometry object encoded as a string with exactly type and coordinates properties, Polygon or MultiPolygon only; finite 2D longitude-latitude positions in EPSG4326, closed rings and valid topology. Maximum actual UTF-8 geometry payload 1048576 bytes and 10000 positions including ring closures are provisional operational caps. Feature, FeatureCollection, any explicit CRS or bounding box, empty and invalid geometries are rejected without repair.
        declaredAreaHectares: { type: number, exclusiveMinimum: 0, maximum: 99999999999999.9999, multipleOf: 0.0001, description: Caller declaration preserved without rounding separately from server-calculated area; no automatic discrepancy approval. }
    ConfiguredFieldGeometry:
      type: object
      additionalProperties: false
      required: [fieldId, organizationId, displayName, type, status, spatialStatus, declaredAreaHectares, calculatedAreaHectares, centroidLatitude, centroidLongitude, boundaryGeoJson, officialProvinceCode, officialDepartmentCode, createdAtUtc, revision, version, geometryVersionId, configuredAtUtc]
      properties:
        fieldId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        displayName: { type: string }
        type: { type: string, const: field }
        status: { type: string, enum: [draft, archived] }
        spatialStatus: { type: string, const: configured }
        declaredAreaHectares: { type: number, exclusiveMinimum: 0 }
        calculatedAreaHectares: { type: number, minimum: 0.0001, multipleOf: 0.0001, description: Server-computed ST_Area(geography) spheroidal square metres divided by 10000 and rounded to four decimal places; an area rounding to zero is rejected. }
        centroidLatitude: { type: number, minimum: -90, maximum: 90, description: Server-derived centroid; not guaranteed inside a concave polygon. }
        centroidLongitude: { type: number, minimum: -180, maximum: 180 }
        boundaryGeoJson: { type: string, description: Validated MultiPolygon EPSG4326 GeoJSON geometry. Polygon wrapping is the only topology normalization. }
        officialProvinceCode: { type: 'null', description: No official territorial containment is inferred. }
        officialDepartmentCode: { type: 'null', description: No official territorial containment is inferred. }
        createdAtUtc: { type: string, format: date-time }
        revision: { type: integer, minimum: 2 }
        version: { type: string, format: uuid }
        geometryVersionId: { type: string, format: uuid }
        configuredAtUtc: { type: string, format: date-time }
    Field:
      type: object
      description: Field summary including archived records and its current spatial status. Configured indicates initial PostGIS-validated geometry, not cadastral status, official territorial containment or agronomic suitability.
      additionalProperties: false
      required: [fieldId, organizationId, displayName, type, status, spatialStatus, createdAtUtc, version]
      properties:
        fieldId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        displayName: { type: string, minLength: 2, maxLength: 120 }
        type: { type: string, const: field }
        status: { type: string, enum: [draft, archived] }
        spatialStatus: { type: string, enum: [not_configured, configured] }
        createdAtUtc: { type: string, format: date-time }
        version: { type: string, format: uuid }
    CreatedField:
      type: object
      additionalProperties: false
      required: [fieldId, organizationId, displayName, type, status, spatialStatus, createdAtUtc, version, isReplay]
      properties:
        fieldId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        displayName: { type: string, minLength: 2, maxLength: 120 }
        type: { type: string, const: field }
        status: { type: string, const: draft }
        spatialStatus: { type: string, const: not_configured }
        createdAtUtc: { type: string, format: date-time }
        version: { type: string, format: uuid }
        isReplay: { type: boolean }
    RenamedField:
      type: object
      description: Rename result preserving the field's current spatial status.
      additionalProperties: false
      required: [fieldId, organizationId, displayName, type, status, spatialStatus, createdAtUtc, revision, version, isReplay]
      properties:
        fieldId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        displayName: { type: string, minLength: 2, maxLength: 120 }
        type: { type: string, const: field }
        status: { type: string, const: draft }
        spatialStatus: { type: string, enum: [not_configured, configured] }
        createdAtUtc: { type: string, format: date-time }
        revision: { type: integer, minimum: 2 }
        version: { type: string, format: uuid }
        isReplay: { type: boolean }
    ArchivedField:
      type: object
      additionalProperties: false
      required: [fieldId, organizationId, displayName, type, status, spatialStatus, createdAtUtc, revision, version, isReplay]
      properties:
        fieldId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        displayName: { type: string, minLength: 2, maxLength: 120 }
        type: { type: string, const: field }
        status: { type: string, const: archived }
        spatialStatus: { type: string, enum: [not_configured, configured] }
        createdAtUtc: { type: string, format: date-time }
        revision: { type: integer, minimum: 2 }
        version: { type: string, format: uuid }
        isReplay: { type: boolean }
    StrongFieldETag:
      type: string
      pattern: '^"[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}"$'
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, correlationId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        code: { type: string }
        correlationId: { type: string }
        retryable: { type: boolean }
