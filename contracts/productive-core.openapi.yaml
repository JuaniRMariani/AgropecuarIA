openapi: 3.1.0
info:
  title: AgropecuarIA Productive Core API
  version: 2.1.0
  description: Tenant-owned productive units. Creation remains a non-spatial draft. Initial geometry configuration validates topology and calculates area with PostGIS; configured does not certify cadastral status, official territorial containment or agronomic suitability.
paths:
  /api/organizations/{organizationId}/fields:
    get:
      summary: List the active owner's fields
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Fields ordered by creation time and field ID
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items: { $ref: '#/components/schemas/Field' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotAvailable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      summary: Create a non-spatial field draft
      description: The server derives actor, tenant, type and initial states. The body never accepts geometry, area, role or identifiers.
      security:
        - SessionCookie: []
          AntiforgeryCookie: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 32, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateFieldRequest' }
      responses:
        '201':
          description: Field created, or the authorized result of an identical replay
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedField' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotAvailable' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/organizations/{organizationId}/fields/{fieldId}:
    get:
      summary: Get one field draft
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - in: path
          name: fieldId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Authorized field
          headers:
            ETag:
              description: Strong entity tag backed by the current field version
              schema: { $ref: '#/components/schemas/StrongFieldETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Field' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotAvailable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
    patch:
      summary: Rename one field draft
      description: The server reauthorizes the owner before replay or resource lookup. A new attempt requires a strong current If-Match value; an authorized replay is resolved before comparing the now-stale resource version.
      security:
        - SessionCookie: []
          AntiforgeryCookie: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - in: path
          name: fieldId
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: If-Match
          required: true
          description: Exactly one strong quoted UUID ETag returned by GET detail or a previous successful rename
          schema: { $ref: '#/components/schemas/StrongFieldETag' }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 32, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenameFieldRequest' }
      responses:
        '200':
          description: Field renamed, or the authorized result of an identical replay
          headers:
            ETag:
              description: Strong entity tag backed by the resulting field version
              schema: { $ref: '#/components/schemas/StrongFieldETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RenamedField' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotAvailable' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/organizations/{organizationId}/fields/{fieldId}/archive:
    post:
      operationId: ArchiveFieldDraft
      summary: Archive an authorized owner's field draft without deleting its history
      description: Reauthorizes before idempotency lookup. Identical authorized retries return the committed version; new requests require the current strong ETag. Atomically persists archive state, idempotency ledger, journal and ManagementUnitArchived event.
      security:
        - SessionCookie: []
          AntiforgeryCookie: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/FieldId'
        - in: header
          name: If-Match
          required: true
          schema: { $ref: '#/components/schemas/StrongFieldETag' }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 32, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$' }
      responses:
        '200':
          description: Field archived or authorized committed result replayed
          headers:
            ETag: { schema: { $ref: '#/components/schemas/StrongFieldETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArchivedField' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotAvailable' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/organizations/{organizationId}/fields/{fieldId}/geometry:
    get:
      operationId: GetFieldGeometry
      description: Owner-only read of the immutable initial geometry snapshot together with the field's current status and ETag. Available for configured draft or archived fields. Use this read and field refresh to reconcile an uncertain mutation response; an unconfigured or inaccessible field has the same neutral 404.
      security:
        - SessionCookie: []
      parameters:
        - {name: organizationId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: fieldId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Confidential stored geometry and server-derived metrics; private no-store response.
          headers:
            ETag:
              schema: { $ref: '#/components/schemas/StrongFieldETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfiguredFieldGeometry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': {description: Unknown, inaccessible or not-configured geometry (productive_core.field_not_available).}
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': {description: Geometry storage or PostGIS unavailable (productive_core.field_geometry_unavailable).}
    post:
      operationId: ConfigureFieldGeometry
      description: Initial configuration only, from not_configured to configured on an active draft field. The server validates Polygon/MultiPolygon in longitude-latitude EPSG4326 and stores an immutable MultiPolygon snapshot. It calculates spheroidal area and centroid; it never trusts client-derived metrics, silently repairs invalid topology, simplifies coordinates or rewrites rings. Declared and calculated areas remain separate without automatic tolerance approval. No idempotency ledger or automatic retry; after an uncertain response, refresh the field and its geometry before deciding whether to submit again. No cadastral, official territorial containment or agronomic certification.
      security:
        - SessionCookie: []
          AntiforgeryCookie: []
      parameters:
        - {name: organizationId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: fieldId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: X-CSRF-TOKEN, in: header, required: true, schema: {type: string}}
        - {name: If-Match, in: header, required: true, schema: {type: string}, description: Strong quoted UUID version.}
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigureFieldGeometryRequest' }
      responses:
        '200':
          description: Validated initial geometry, immutable snapshot and audit/event committed atomically. Calculated area uses postgis-geography-spheroid; not a professional certification.
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfiguredFieldGeometry' }
        '400': {description: Invalid geometry (productive_core.field_geometry_invalid), unmapped request member, missing or malformed strong If-Match, or antiforgery failure.}
        '401': {description: Authentication required.}
        '404': {description: Neutral unauthorized or unknown resource.}
        '409': {description: Geometry already configured (productive_core.field_geometry_already_configured); replacement and editing are not supported.}
        '412': {description: Stale version (productive_core.field_version_stale).}
        '413': {description: Geometry exceeds operational payload or vertex limit (productive_core.field_geometry_too_large).}
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': {description: PostGIS or persistence unavailable (productive_core.field_geometry_unavailable). No automatic retry; refresh committed state first because a response failure may follow a commit.}
  /api/organizations/{organizationId}/fields/{fieldId}/cycles:
    get:
      operationId: ListProductionCycles
      deprecated: true
      summary: List cycles belonging to an authorized owner's field
      description: Revalidates the durable session and owner membership in the same tenant-scoped transaction as the field and cycle reads. Foreign and missing resources return the same neutral 404.
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/FieldId'
      responses:
        '200':
          description: Cycles ordered by descending start date and then cycle ID. Reads preserve stored snapshots without consulting current Catalog; legacy cycles expose catalogSnapshot null and catalogReferenceStatus legacy_unresolved.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProductionCycle' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotAvailable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/CycleUnavailable' }
    post:
      operationId: StartProductionCycle
      summary: Start a production cycle on an authorized owner's field
      description: Actor, durable session and tenant are revalidated before locking the field or inserting a cycle. Archived fields reject new cycles with productive_core.field_archived; existing history remains readable. Catalog code resolves through the public application port against one active Catalog MVCC snapshot after field authorization. expectedCatalogVersionId is an optional precondition, not a historical selector; mismatch (including no active publication) is checked before item lookup. Display name and declared support are server-derived, while effective support remains FLUJO_GENERICO. Publication may change after resolution; the cycle preserves the resolved version and source snapshot, not a guarantee of active version at commit. No professional approval is implied. This operation has no idempotency ledger; do not automatically resubmit an unconfirmed write.
      security:
        - SessionCookie: []
          AntiforgeryCookie: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/FieldId'
        - {name: X-CSRF-TOKEN, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartProductionCycleRequest' }
      responses:
        '201':
          description: Production cycle created with an immutable authoritative publication snapshot
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductionCycle' }
        '400': { $ref: '#/components/responses/CycleBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': {description: Neutral unknown or inaccessible field; after successful field authorization, absent catalog code returns productive_core.catalog_item_not_found without inserting a cycle.}
        '409': {description: Archived field (productive_core.field_archived), no active catalog without a precondition (productive_core.catalog_not_published), or active catalog differs from expectedCatalogVersionId (productive_core.catalog_version_stale). No cycle is inserted; refresh and review before a new submission.}
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': {description: Catalog resolution unavailable (productive_core.catalog_unavailable) or cycle persistence outcome unconfirmed (productive_core.cycle_unavailable). No fallback to client metadata and no automatic replay; reconcile before retry.}
  /api/organizations/{organizationId}/cycles/{cycleId}/events:
    post:
      operationId: RecordProductionEvent
      summary: Append an observation to an authorized owner's active cycle
      description: Authorizes owner, cycle and its field inside one tenant transaction. Events cannot be overwritten or deleted by the app role. No idempotency ledger is available; do not automatically resubmit an unconfirmed write.
      security:
        - SessionCookie: []
          AntiforgeryCookie: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/CycleId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordProductionEventRequest' }
      responses:
        '201':
          description: Production event recorded
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductionEvent' }
        '400': { $ref: '#/components/responses/CycleBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotAvailable' }
        '409':
          description: The authorized cycle is not active (productive_core.cycle_not_active)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/CycleUnavailable' }
  /api/organizations/{organizationId}/cycles/{cycleId}/timeline:
    get:
      operationId: GetProductionTimeline
      deprecated: true
      summary: Read an authorized owner's cycle and observation timeline
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/CycleId'
      responses:
        '200':
          description: Cycle and events ordered by effective date, recorded date and ID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductionTimeline' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotAvailable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/CycleUnavailable' }
  /api/organizations/{organizationId}/fields/{fieldId}/cycles/page:
    get:
      operationId: ListProductionCyclePage
      summary: Read a bounded page of stored cycle history
      description: Reauthorizes owner and field for every page, including archived fields. Ordered by createdAtUtc DESC then id DESC. Cursor is a resource-bound position, not authorization. Reads preserve historical catalog metadata without calling Catalog. Separate requests do not share an MVCC snapshot. The unpaged legacy route is deprecated but unchanged.
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/FieldId'
        - $ref: '#/components/parameters/HistoryLimit'
        - $ref: '#/components/parameters/HistoryCursor'
      responses:
        '200':
          description: At most limit cycles; hasMore is true exactly when nextCursor is non-null. No total count is promised.
          headers:
            Cache-Control: { schema: { type: string, const: 'private, no-store' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductionCyclePage' }
        '400': { $ref: '#/components/responses/HistoryBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotAvailable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/CycleUnavailable' }
  /api/organizations/{organizationId}/cycles/{cycleId}/timeline/page:
    get:
      operationId: GetProductionTimelinePage
      summary: Read a cycle snapshot and a bounded page of recorded observations
      description: Reauthorizes owner, cycle and field for every page, including archived fields. Ordered by recordedAtUtc DESC then id DESC, not effectiveDateUtc. Effective date remains an independent business value. Preserves stored catalog snapshots without calling Catalog. Cursor is a resource-bound position, not authorization. Separate requests do not share an MVCC snapshot. The unpaged legacy route is deprecated but unchanged.
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/CycleId'
        - $ref: '#/components/parameters/HistoryLimit'
        - $ref: '#/components/parameters/HistoryCursor'
      responses:
        '200':
          description: Stored cycle and at most limit observations; hasMore is true exactly when nextCursor is non-null. A cycle without events still has its stored snapshot.
          headers:
            Cache-Control: { schema: { type: string, const: 'private, no-store' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductionTimelinePage' }
        '400': { $ref: '#/components/responses/HistoryBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotAvailable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/CycleUnavailable' }
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: __Host-agro-session
    AntiforgeryCookie:
      type: apiKey
      in: header
      name: X-CSRF-TOKEN
  parameters:
    HistoryLimit:
      in: query
      name: limit
      required: false
      schema: { type: integer, format: int32, default: 20, minimum: 1, maximum: 100 }
    HistoryCursor:
      in: query
      name: cursor
      required: false
      description: Opaque versioned continuation from this resource and history kind. Omit for the first page; empty, malformed, unsupported-version or cross-context values are rejected. Not a credential and not an immutable multi-request snapshot.
      schema: { type: string, minLength: 1, maxLength: 512, pattern: '^[A-Za-z0-9_-]+$' }
    FieldId:
      in: path
      name: fieldId
      required: true
      schema: { type: string, format: uuid }
    CycleId:
      in: path
      name: cycleId
      required: true
      schema: { type: string, format: uuid }
    OrganizationId:
      in: path
      name: organizationId
      required: true
      description: Resource locator only; authorization and tenant context are derived and revalidated by the server.
      schema: { type: string, format: uuid }
  responses:
    HistoryBadRequest:
      description: Invalid page limit or cursor (productive_core.invalid_history_query); malformed typed HTTP parameters may be rejected before application execution.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    CycleBadRequest:
      description: Invalid cycle or event request, or invalid antiforgery token
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    CycleUnavailable:
      description: The cycle operation could not be confirmed (productive_core.cycle_unavailable). A write might have committed; automatic retry is not safe without reconciliation.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    BadRequest:
      description: Invalid display name, idempotency key, If-Match syntax or unchanged canonical name
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Missing, expired or revoked durable session
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotAvailable:
      description: Organization, membership or field is not available to the current actor
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Idempotency key mismatch, an in-progress attempt, or organization field capacity reached (productive_core.management_unit_capacity_reached)
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PreconditionFailed:
      description: The authorized field changed after the supplied strong ETag was issued; the current representation is not disclosed in the error
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: Request rate exceeded
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unavailable:
      description: Idempotency reconciliation, Productive Core configuration or persistence is unavailable; retry preserves the same key
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    ProductionCyclePage:
      type: object
      additionalProperties: false
      required: [items, hasMore, nextCursor]
      properties:
        items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/ProductionCycle' } }
        hasMore: { type: boolean }
        nextCursor: { type: [string, 'null'], minLength: 1, maxLength: 512, pattern: '^[A-Za-z0-9_-]+$' }
      oneOf:
        - properties: { hasMore: { const: true }, nextCursor: { type: string } }
        - properties: { hasMore: { const: false }, nextCursor: { type: 'null' } }
    ProductionTimelinePage:
      type: object
      additionalProperties: false
      required: [cycle, events, hasMore, nextCursor]
      properties:
        cycle: { $ref: '#/components/schemas/ProductionCycle' }
        events: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/ProductionEvent' } }
        hasMore: { type: boolean }
        nextCursor: { type: [string, 'null'], minLength: 1, maxLength: 512, pattern: '^[A-Za-z0-9_-]+$' }
      oneOf:
        - properties: { hasMore: { const: true }, nextCursor: { type: string } }
        - properties: { hasMore: { const: false }, nextCursor: { type: 'null' } }
    StartProductionCycleRequest: {"type":"object","additionalProperties":false,"required":["catalogCode","purpose","system","startDateUtc"],"properties":{"catalogCode":{"type":"string","minLength":1,"maxLength":64},"purpose":{"type":"string","minLength":1,"maxLength":128},"system":{"type":"string","minLength":1,"maxLength":128},"startDateUtc":{"type":"string","format":"date-time"},"expectedCatalogVersionId":{"type":["string","null"],"format":"uuid","description":"Optional active-version precondition, not a historical version selector; mismatches are detected before item lookup."}}}
    RecordProductionEventRequest:
      type: object
      required: [eventType, effectiveDateUtc]
      properties:
        eventType: { type: string }
        effectiveDateUtc: { type: string, format: date-time }
        quantity: { type: [number, 'null'] }
        unit:
          type: [string, 'null']
          description: Required and nonblank when quantity is specified
        notes: { type: [string, 'null'] }
        origin:
          type: [string, 'null']
          description: Defaults to manual; trimmed and lowercased before validating manual, importacion, dispositivo, calculo or ia
